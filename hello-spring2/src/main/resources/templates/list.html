<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>게시판 목록</title>
</head>
<body>
<h1>게시글 목록</h1>

<!-- 글 작성 버튼 -->
<a th:href="@{/write}">글쓰기</a>
<br><br>

<!-- 게시글 목록 테이블 -->
<table border="1">
    <thead>
    <tr>
        <th>번호</th>
        <th>제목</th>
        <th>작성자</th>
    </tr>
    </thead>
    <tbody>
    <!-- boards: 컨트롤러에서 전달된 게시글 리스트 -->
    <tr th:each="board : ${boards}">
        <td th:text="${board.id}">1</td>
        <!-- 게시글 제목 클릭 시 상세보기로 이동 -->
        <td>
            <a th:href="@{/detail/{id}(id=${board.id})}"
               th:text="${board.title}">제목</a>
        </td>
        <td th:text="${board.writer}">작성자</td>
    </tr>
    </tbody>
</table>
</body>
</html>
