<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>게시글 작성</title>
</head>
<body>
<h1>게시글 작성</h1>

<form th:action="@{/boards}" method="post" enctype="multipart/form-data">
  제목: <input type="text" name="title" required><br><br>
  내용: <textarea name="content" required></textarea><br><br>
  파일 업로드: <input type="file" name="file"><br><br>
  <button type="submit">저장</button>
</form>

<br>
<a href="/boards">목록으로</a>
</body>
</html>
