<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>게시글 수정</title>
</head>
<body>
<h1>게시글 수정</h1>

<!-- 게시글 수정 폼 -->
<form th:action="@{/boards/{id}/update(id=${board.id})}" method="post">
  <input type="hidden" name="id" th:value="${board.id}">

  <!-- 제목 입력 -->
  <label>제목: </label>
  <input type="text" name="title" th:value="${board.title}" required>

  <br><br>

  <!-- 내용 입력 -->
  <label>내용: </label>
  <textarea name="content" required th:text="${board.content}"></textarea>

  <br><br>

  <!-- 수정 버튼 -->
  <button type="submit">수정</button>
</form>

<!-- 목록으로 돌아가기 -->
<br>
<a href="/boards">목록으로</a>
</body>
</html>
