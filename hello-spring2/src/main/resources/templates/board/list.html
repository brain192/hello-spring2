<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>게시판 목록</title>
</head>
<body>
<h1>게시판</h1>
<a href="/boards/new">글쓰기</a>
<table border="1">
  <tr>
    <th>ID</th>
    <th>제목</th>
  </tr>
  <!-- Thymeleaf 반복문: 서버에서 전달된 게시글 리스트를 반복하여 출력 -->
  <tr th:each="board : ${boards}">
    <td th:text="${board.id}"></td>
    <td><a th:href="@{/boards/{id}(id=${board.id})}" th:text="${board.title}"></a></td>
  </tr>
</table>
</body>
</html>
