<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>로그인</title></head>
<body>
<h1>로그인</h1>

<form th:action="@{/login}" method="post">
  <label>아이디: <input type="text" name="username" required /></label><br><br>
  <label>비밀번호: <input type="password" name="password" required /></label><br><br>
  <button type="submit">로그인</button>
</form>

<p th:if="${loginError}" th:text="${loginError}" style="color:red;"></p>
<a th:href="@{/register}">회원가입</a>
</body>
</html>
