<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><title>글 상세</title></head>
<body>
<h2 th:text="${board.title}">제목</h2>
<p th:text="${board.content}">내용</p>

<!-- 파일이 있을 때만 다운로드 링크 제공 -->
<div th:if="${board.originalFilename}">
  첨부파일:
  <a th:href="@{'/boards/download/' + ${board.id}}" th:text="${board.originalFilename}"></a>
</div>

<a href="/boards">목록으로</a>
</body>
</html>
