<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><title>게시판 목록</title></head>
<body>
<h2>게시판 목록</h2>
<a href="/boards/write">글쓰기</a>
<ul>
  <li th:each="board : ${boards}">
    <a th:href="@{'/boards/detail/' + ${board.id}}"
       th:text="${board.title}">제목</a>
  </li>
</ul>
</body>
</html>
